<!DOCTYPE html>
    <html>

    <!--Страница всегда делится на две части
        head, body

        в head мы всегда пишем SEO оптимизацию, название страницы и другие мета теги

        в body содержание страницы (таблички, заголовки, изображения и т.д-->
    <head>
<!--    Установка кодировки сайта  -->
        <meta charset = "UTF-8" />
<!--    Важно для моб.устройств    -->
        <meta name="viewport" content = "width=divice-width, initial-scale=1.0" />
    </head>
    <body>
<!--    CЕМАНТИКА     -->
        <!--Сементические теги - специальные теги, которые читает поисковый робот,
        чтобы оценить важность контента на странице и для скринридеров -->

        <!--    Не семантически верный подход    -->
        <div class="header">
            Content
        </div>

        <!--    Семантически верный подход    -->
        <header class = "header">
            Content
        </header>
        <footer class = "footer">
            content
        </footer>

        <!--    main - Главное уникальное содержимое (один раз на странице)    -->
        <main>
            Главный контент
            <div>
                content1
            </div>
            <p>
                12345
            </p>
        </main>

        <!--    aside - Боковая панель сайта     -->
        <aside>
            Боковая панель сайта
        </aside>

        <!--        section - логиеский блок (секции) -->
        <section>
            Секция, похожая на div
        </section>

        <!--  article - независимая единица(постов, карточки товара, статей)  -->
        <article>

        </article>

        <!--   тег <b> делает шрифт более жирным только визуально,
        а тег <strong> ещё и подсказывает роботу,
        что текст считается семантитечки более важным     -->
        <b>
            полужирный шрифт
        </b>
        <strong>
            полужирный шрифт
        </strong>
    <!--    Конец семантики    -->
    <!--  База HTML  -->
        <!--  Одиночные теги - те, что не имеют body
        hr - Горизонтальная линия
        img - изображение
        input - поле ввода
        br - перенос строки-->
        <hr>
        <img scr="" alt = "Текст, который робот прочитает">
        <input>
        <br>
        <!--Не одиночный тег-->
        <button></button>
        <header></header>
        <article></article>
    <!--  конец базы HTML  -->
    </body>
</html>
